<!-- @dsCard group="Colors" viewport="700x150" name="Semantic Tones" subtitle="Soft-tinted backgrounds for status; distinct success green" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:14px 16px;background:var(--bg)}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.t{border-radius:var(--radius-md);padding:12px 14px;font-weight:var(--weight-bold);font-size:var(--text-sm);border:1px solid transparent}
.k{font-family:var(--font-mono);font-weight:400;font-size:11px;opacity:.75;display:block;margin-top:2px}</style></head><body>
<div class="g">
<div class="t" style="background:var(--success-soft-bg);color:var(--success-soft-fg)">Success<span class="k">--success</span></div>
<div class="t" style="background:var(--info-soft-bg);color:var(--info-soft-fg)">Info<span class="k">--info</span></div>
<div class="t" style="background:var(--warning-soft-bg);color:var(--warning-soft-fg);border-color:var(--danger-soft-border)">Warning<span class="k">--warning</span></div>
<div class="t" style="background:var(--danger-soft-bg);color:var(--danger-soft-fg);border-color:var(--danger-soft-border)">Danger<span class="k">--danger</span></div>
</div>
<div style="margin-top:10px;font-size:var(--text-xs);color:var(--fg-muted)">Success is a distinct cooler green (<code>#22824a</code>) so it never reads as the apple brand green.</div>
</body></html>
