<!-- @dsCard group="Colors" viewport="700x170" name="Themes" subtitle="Light default, dark via [data-theme=dark]; system-following" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:14px 16px;background:var(--bg)}
.half{border-radius:var(--radius-lg);padding:14px 16px;border:1px solid var(--border)}
.chip{display:inline-block;border-radius:var(--radius-sm);padding:4px 10px;font-size:12px;font-weight:700;margin-right:6px}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="half" style="background:var(--color-light-bg);color:var(--color-light-fg)"><b style="font-weight:900">Light</b> <code style="background:#fff">steel-blue-50 / #222</code><div style="margin-top:8px"><span class="chip" style="background:#458336;color:#fff">accent</span><span class="chip" style="background:#39672e;color:#e7f5e3">sidebar</span><span class="chip" style="background:#fff;color:#222;border:1px solid #d0dbe7">card</span></div></div>
<div class="half" style="background:var(--color-dark-bg);color:var(--color-dark-fg);border-color:#30445c"><b style="font-weight:900">Dark</b> <code style="background:#2c3b4e;border-color:#30445c;color:#efefef">steel-blue-950 / #efefef</code><div style="margin-top:8px"><span class="chip" style="background:#62b04f;color:#11250e">accent</span><span class="chip" style="background:#294423;color:#e7f5e3">sidebar</span><span class="chip" style="background:#2c3b4e;color:#efefef;border:1px solid #30445c">card</span></div></div>
</div>
</body></html>
