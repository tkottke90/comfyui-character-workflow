<!-- @dsCard group="Spacing & Shape" viewport="700x240" name="Layer Stack" subtitle="Drawers & Dialogs › Toasts › Headers › Main Content › Sidebars — each layer casts a shadow on the one below" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;background:var(--bg);display:flex;gap:20px;align-items:flex-start}
.stage{position:relative;width:340px;height:200px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-sunken);flex-shrink:0}
.side{position:absolute;left:0;top:0;bottom:0;width:88px;background:var(--sidebar-bg);z-index:var(--z-sidebar);padding:34px 10px;font:700 10px var(--font-sans);color:var(--sidebar-fg)}
.main{position:absolute;left:72px;top:0;right:0;bottom:0;background:var(--bg);z-index:var(--z-main);box-shadow:var(--shadow-layer-main);padding:40px 14px 0;font:600 10px var(--font-sans);color:var(--fg-muted)}
.hdr{position:absolute;left:72px;top:0;right:0;height:28px;background:var(--header-bg);color:var(--header-fg);z-index:var(--z-header);box-shadow:var(--shadow-layer-header);display:flex;align-items:center;padding:0 12px;font:700 10px var(--font-sans)}
.toast{position:absolute;right:8px;bottom:8px;background:var(--surface-raised);border:1px solid var(--border);border-left:3px solid var(--success);border-radius:var(--radius-sm);z-index:var(--z-toast);box-shadow:var(--shadow-toast);padding:5px 9px;font:700 10px var(--font-sans)}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-38%,-42%);width:130px;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-md);z-index:var(--z-overlay);box-shadow:var(--shadow-overlay);padding:9px 11px;font:700 11px var(--font-sans)}
ol{margin:0;padding-left:18px;font:600 var(--text-sm)/1.9 var(--font-sans)}
li{white-space:nowrap}
ol code{font-size:11px;margin-left:6px}
li span{color:var(--fg-muted);font-weight:400}</style></head><body>
<div class="stage">
<div class="side">Sidebar</div>
<div class="main">Main content</div>
<div class="hdr">Header</div>
<div class="toast">✓ Toast</div>
<div class="dlg">Dialog<div style="font-weight:400;color:var(--fg-muted);font-size:10px">Highest layer</div></div>
</div>
<ol reversed>
<li>Drawers & Dialogs<code>--z-overlay</code></li>
<li>Toasts<code>--z-toast</code></li>
<li>Headers<code>--z-header</code></li>
<li>Main Content<code>--z-main</code></li>
<li>Sidebars<code>--z-sidebar</code></li>
</ol>
</body></html>
