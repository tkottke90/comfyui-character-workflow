<!-- @dsCard group="Components" viewport="700x420" name="Drawers" subtitle="Native <dialog> side panels: slide in/out left or right, ease-out, blurred backdrop" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:18px 20px;background:var(--bg)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Drawer, Button, Field, Input } = window.TDKDesignSystem_abba7a;
function Demo(){
  const [right,setRight]=React.useState(true);
  const [left,setLeft]=React.useState(false);
  return <div style={{display:'flex',flexDirection:'column',gap:12,maxWidth:560}}>
    <div style={{display:'flex',gap:10}}>
      <Button variant="outlined" tone="secondary" onClick={()=>setLeft(true)}>Open left drawer</Button>
      <Button variant="outlined" onClick={()=>setRight(true)}>Open right drawer</Button>
    </div>
    <p style={{margin:0,fontSize:'var(--text-sm)',color:'var(--fg-muted)'}}>Native <code>&lt;dialog&gt;</code> · slides in from left/right with ease-out, slides out on dismiss · backdrop #222 @ 33% + blur (matches Dialog) · close via ×, backdrop click, or Esc.</p>
    <Drawer open={right} title="Sensor settings" onClose={()=>setRight(false)}
      actions={<><Button onClick={()=>setRight(false)}>Save</Button><Button variant="text" tone="secondary" onClick={()=>setRight(false)}>Cancel</Button></>}>
      <Field label="Sensor name" htmlFor="sn"><Input id="sn" defaultValue="Greenhouse A"/></Field>
    </Drawer>
    <Drawer open={left} side="left" title="Navigation" onClose={()=>setLeft(false)} width={300}>
      <div style={{display:'flex',flexDirection:'column',gap:'var(--space-2)',fontSize:'var(--text-sm)'}}>
        <span>Dashboard</span><span>Sensors</span><span>History</span><span>Settings</span>
      </div>
    </Drawer>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
