<!-- @dsCard group="Components" viewport="700x980" name="Chat" subtitle="Structured messages, tool calls, attachments, NSFW blur, composer with + menu and model chip" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:18px 20px;background:var(--bg)}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.TDKDesignSystem_abba7a;
const { ChatBubble, ChatComposer, IconButton } = NS;
const ChatToolCall = NS.ChatToolCall || (({name})=><div style={{fontSize:12,color:'var(--danger)'}}>ChatToolCall unavailable (stale bundle — refresh): {name}</div>);
const icn=(d)=><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>;
const copyIc=icn(<><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V4a2 2 0 0 1 2-2h10"/></>);
const upIc=icn(<path d="M7 10v12m8-16.12L14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>);
const dnIc=icn(<path d="M17 14V2m-8 16.12L10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/>);
function Demo(){
  const [draft,setDraft]=React.useState('');
  const [atts,setAtts]=React.useState([{kind:'image',name:'weekend.png',src:'../../assets/sample-media.png',size:'640 KB'},{kind:'file',name:'notes.md',size:'4 KB'}]);
  const act=(ic,l)=><IconButton size="sm" label={l}>{ic}</IconButton>;
  return <div style={{maxWidth:560,display:'flex',flexDirection:'column',gap:14}}>
    <ChatBubble from="other" author="Sam" timestamp={Date.now()-5*60000} actions={act(copyIc,'Copy')}
      files={[{name:'bed-layout.pdf',size:'1.2 MB'},{name:'soil-test-results.csv',size:'18 KB'},{name:'irrigation-schedule.xlsx',size:'42 KB'}]}>
      Here's the plan for the new raised bed — thoughts?
    </ChatBubble>
    <ChatBubble from="self" timestamp={Date.now()-2*60000} actions={act(copyIc,'Copy')}
      images={[{src:'../../assets/sample-media.png',alt:'Balloons over a crowd'},{src:'../../assets/sample-media.png',alt:'Blurred example',nsfw:true}]}>
      Looks great! Photos from the weekend — second one's marked NSFW as a demo.
    </ChatBubble>
    <ChatBubble from="ai" author="Assistant" timestamp="2024-08-04T08:43:00"
      metrics={{time:'1.24s',tps:'38 tok/s',cost:'$0.003'}}
      actions={<>{act(copyIc,'Copy')}{act(upIc,'Like')}{act(dnIc,'Dislike')}</>}
      audio={{name:'summary.mp3',duration:'0:42'}}>
      Bed 2 gets 6.5 hrs of sun — plenty for tomatoes. I've attached an audio summary.
    </ChatBubble>
    <ChatBubble from="ai" author="Assistant" timestamp={Date.now()-60000}
      metrics={{time:'3.02s',tps:'41 tok/s',cost:'$0.007'}}
      actions={<>{act(copyIc,'Copy')}{act(upIc,'Like')}{act(dnIc,'Dislike')}</>}>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        <div>Let me check today's weather and your soil sensors before recommending a watering time.</div>
        <ChatToolCall name="get_weather" input='{ "zip": "97210" }' result={'82\u00b0F, clear \u00b7 0% rain through 8 PM \u00b7 UV high'} duration="0.31s"/>
        <ChatToolCall name="get_soil_moisture" input='{ "bed": 2 }' result={'Bed 2: 31% VWC (dry) \u00b7 last watered 26 hrs ago'} duration="0.18s"/>
        <div>It'll stay hot and dry through the evening and bed 2 is at 31% moisture — water tonight around 7 PM, about 15 minutes.</div>
      </div>
    </ChatBubble>
    <ChatComposer value={draft} onChange={setDraft} onSend={()=>setDraft('')} attachments={atts} onAttachmentsChange={setAtts}/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
