<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:18px 20px;background:var(--bg)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Field, Input, Select, Textarea, Checkbox, Radio, Switch } = window.TDKDesignSystem_abba7a;
function Demo(){
  const [c,setC]=React.useState(true),[r,setR]=React.useState('md'),[s,setS]=React.useState(true);
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,alignItems:'start'}}>
    <Field label="Project name" hint="Visible on your dashboard" required htmlFor="f1"><Input id="f1" defaultValue="Garden Tracker"/></Field>
    <Field label="Category" htmlFor="f2"><Select id="f2" options={['Personal','Tooling','Website']}/></Field>
    <Field label="Email" error="That doesn't look like an email" htmlFor="f3"><Input id="f3" type="email" defaultValue="tdk@" invalid/></Field>
    <Field label="Notes" htmlFor="f4"><Textarea id="f4" rows={2} placeholder="Anything else…"/></Field>
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      <Checkbox label="Email me updates" checked={c} onChange={setC}/>
      <Checkbox label="Disabled option" disabled/>
      <Switch label="Public project" checked={s} onChange={setS}/>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      <Radio name="sz" value="sm" label="Small" checked={r==='sm'} onChange={setR}/>
      <Radio name="sz" value="md" label="Medium" checked={r==='md'} onChange={setR}/>
      <Radio name="sz" value="lg" label="Large" checked={r==='lg'} onChange={setR}/>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
