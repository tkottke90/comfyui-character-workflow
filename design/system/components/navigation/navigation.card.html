<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:0;background:var(--bg)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { SidebarNav, Tabs, Breadcrumbs, Card } = window.TDKDesignSystem_abba7a;
function Demo(){
  const [tab,setTab]=React.useState(0);
  const [nav,setNav]=React.useState('home');
  return <div style={{display:'flex',height:300}}>
    <SidebarNav brand="TDK_Design" logoSrc="../../assets/logo.svg" activeId={nav} onSelect={setNav}
      items={[{id:'home',label:'Dashboard'},{id:'projects',label:'Projects'},{id:'notes',label:'Notes'}]}
      actionItems={[{id:'settings',label:'Settings'}]} style={{width:180,padding:'16px 10px'}}/>
    <div style={{flex:1,padding:'16px 20px'}}>
      <Breadcrumbs items={[{label:'Home',href:'#'},{label:'Projects',href:'#'},{label:'Garden Tracker'}]} style={{marginBottom:12}}/>
      <Tabs tabs={['Overview','Activity','Settings']} active={tab} onChange={setTab}/>
      <Card style={{borderTopLeftRadius:0}}><span style={{fontSize:'var(--text-sm)',color:'var(--fg-muted)'}}>{['Overview panel','Activity panel','Settings panel'][tab]} — active tab merges into the panel.</span></Card>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
