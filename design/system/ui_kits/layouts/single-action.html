<!-- @startingPoint section="Layouts" subtitle="Single-action layout: centered card for login and focused tasks" viewport="1280x800" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Single Action Layout</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body,#root{height:100%}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Card, Field, Input, Button, Checkbox, Toast, ToastStack } = window.TDKDesignSystem_abba7a;
function App(){
  const [email,setEmail]=React.useState('');
  const [pw,setPw]=React.useState('');
  const [remember,setRemember]=React.useState(true);
  const [sent,setSent]=React.useState(false);
  return <div style={{minHeight:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'var(--space-5)',padding:'var(--space-6)'}}>
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'var(--space-2)'}}>
      <img src="../../assets/logo.svg" alt="" style={{height:56}}/>
      <div style={{fontWeight:'var(--weight-heading)',fontSize:'var(--text-xl)',letterSpacing:'.01em'}}>TDK_Design</div>
    </div>
    <Card style={{width:'100%',maxWidth:'var(--single-action-max)'}}>
      <h2 style={{fontSize:'var(--text-lg)',marginBottom:'var(--space-4)'}}>Welcome back</h2>
      <form onSubmit={e=>{e.preventDefault();setSent(true);setTimeout(()=>setSent(false),3500)}} style={{display:'flex',flexDirection:'column',gap:'var(--space-4)'}}>
        <Field label="Email" htmlFor="em"><Input id="em" type="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)} autoComplete="email"/></Field>
        <Field label="Password" htmlFor="pw"><Input id="pw" type="password" placeholder="••••••••" value={pw} onChange={e=>setPw(e.target.value)}/></Field>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <Checkbox label="Remember me" checked={remember} onChange={setRemember}/>
          <a href="#" style={{fontSize:'var(--text-sm)'}}>Forgot password?</a>
        </div>
        <Button type="submit" fullWidth size="lg">Sign in</Button>
      </form>
    </Card>
    <div style={{fontSize:'var(--text-sm)',color:'var(--fg-muted)'}}>No account? <a href="#">Create one</a></div>
    <ToastStack>{sent&&<Toast tone="success" title="Signed in" message="Redirecting to your dashboard…" onDismiss={()=>setSent(false)}/>}</ToastStack>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
