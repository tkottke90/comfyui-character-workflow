<!-- @startingPoint section="Layouts" subtitle="Stacked layout: top green header bar over a single content column" viewport="1280x800" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stacked Layout</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body,#root{height:100%}
.hdr-links{display:flex;gap:4px}
@media (max-width:640px){.hdr-links{display:none}}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Button, Badge, Card, Stepper, ProgressBar, Breadcrumbs } = window.TDKDesignSystem_abba7a;
function App(){
  const [step,setStep]=React.useState(1);
  const links=['Overview','Docs','Changelog'];
  return <div style={{minHeight:'100%',display:'flex',flexDirection:'column'}}>
    <header style={{background:'var(--header-bg)',color:'var(--header-fg)',padding:'0 var(--space-6)',display:'flex',alignItems:'center',gap:'var(--space-6)',height:56,position:'sticky',top:0,zIndex:'var(--z-header)',boxShadow:'var(--shadow-layer-header)'}}>
      <div style={{display:'flex',alignItems:'center',gap:'var(--space-2)'}}>
        <img src="../../assets/logo.svg" alt="" style={{height:26,filter:'var(--header-logo-filter)'}}/>
        <span style={{fontWeight:'var(--weight-heading)',color:'var(--header-fg)'}}>TDK_Design</span>
      </div>
      <nav className="hdr-links">{links.map((l,i)=><a key={l} href="#" style={{color:i===0?'var(--header-active-fg)':'var(--header-fg-muted)',textDecoration:'none',fontWeight:600,fontSize:'var(--text-sm)',padding:'6px 12px',borderRadius:'var(--radius-md)',background:i===0?'var(--header-active-bg)':'transparent'}}>{l}</a>)}</nav>
      <div style={{flex:1}}></div>
      <Button size="sm" variant="secondary">Sign in</Button>
    </header>
    <main style={{flex:1,width:'100%',maxWidth:760,margin:'0 auto',padding:'var(--space-8) var(--space-5)'}}>
      <Breadcrumbs items={[{label:'Home',href:'#'},{label:'Setup'}]} style={{marginBottom:'var(--space-3)'}}/>
      <h1>Set up your workspace</h1>
      <p style={{color:'var(--fg-muted)',marginBottom:'var(--space-6)'}}>Three quick steps and you're in. <Badge tone="green">~2 min</Badge></p>
      <Card>
        <Stepper steps={['Account','Preferences','Confirm']} current={step}/>
        <div style={{margin:'var(--space-6) 0'}}><ProgressBar value={(step+1)/3*100}/></div>
        <div style={{display:'flex',justifyContent:'space-between'}}>
          <Button variant="ghost" disabled={step===0} onClick={()=>setStep(s=>Math.max(0,s-1))}>Back</Button>
          <Button onClick={()=>setStep(s=>Math.min(2,s+1))}>{step===2?'Finish':'Continue'}</Button>
        </div>
      </Card>
    </main>
    <footer style={{borderTop:'1px solid var(--border)',padding:'var(--space-4) var(--space-6)',fontSize:'var(--text-sm)',color:'var(--fg-muted)',display:'flex',justifyContent:'space-between'}}>
      <span>© 2026 TDK_Design</span><a href="#">Contact</a>
    </footer>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
